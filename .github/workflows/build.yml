name: Build HeroGen

# Native builds per OS — this is how Windows and Mac installers should be
# produced. Cross-building Windows from Linux requires Wine (for exe icon /
# metadata editing) and produces inferior results, so each platform builds
# on its own runner instead.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Needed so tagged builds can create/update the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            dist_script: dist:linux
          - os: windows-latest
            platform: windows
            dist_script: dist:win
          - os: macos-latest
            platform: mac
            dist_script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (${{ matrix.platform }})
        run: npm run ${{ matrix.dist_script }}
      - uses: actions/upload-artifact@v4
        with:
          name: herogen-${{ matrix.platform }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
          if-no-files-found: ignore
      # On a version tag (e.g. v1.0.0), each OS job attaches its installers
      # to the same GitHub Release for that tag — that's the public
      # download page: github.com/art4ur/HeroGen/releases
      # The release starts as a DRAFT so you can write notes and check the
      # assets before anyone can download them; hit "Publish release"
      # when it looks right. Manual (workflow_dispatch) runs skip this.
      - name: Publish to GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
