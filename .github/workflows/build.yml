name: Build HeroGen

# Native builds per OS — this is how Windows and Mac installers should be
# produced. Cross-building Windows from Linux requires Wine (for exe icon /
# metadata editing) and produces inferior results, so each platform builds
# on its own runner instead.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            dist_script: dist:linux
          - os: windows-latest
            platform: windows
            dist_script: dist:win
          - os: macos-latest
            platform: mac
            dist_script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (${{ matrix.platform }})
        run: npm run ${{ matrix.dist_script }}
      - uses: actions/upload-artifact@v4
        with:
          name: herogen-${{ matrix.platform }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore
